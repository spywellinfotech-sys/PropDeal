name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code lo
        uses: actions/checkout@v4

      - name: Java setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter setup
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter project banao aur files daalo
        run: |
          flutter create --org com.spywell --platforms android --project-name property_network ../app
          cp pubspec.yaml ../app/pubspec.yaml
          rm -rf ../app/lib && cp -r lib ../app/lib
          cp -r assets ../app/assets
          cp android/app/src/main/AndroidManifest.xml ../app/android/app/src/main/AndroidManifest.xml
          cp -r android/app/src/main/res/. ../app/android/app/src/main/res/
          rm -rf ../app/test

      - name: Code check
        working-directory: ../app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: APK build
        working-directory: ../app
        run: |
          mkdir -p ~/.android && cp $GITHUB_WORKSPACE/signing/debug.keystore ~/.android/debug.keystore
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/PropDeal.apk

      - name: APK save karo (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PropDeal-apk
          path: PropDeal.apk

      - name: Release me APK daalo (phone se seedha download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: PropDeal v2.0.${{ github.run_number }}
          files: PropDeal.apk
