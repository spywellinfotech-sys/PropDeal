<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Property Network</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one narrow column of contact cards, sticky filter bar, big tap targets for calling on a phone */
:root{
  --bg:#F2F5F2; --surface:#FFFFFF; --fg:#16201C; --muted:#53605A; --line:#DCE3DE;
  --accent:#0E6655; --accent-fg:#FFFFFF; --soft:#DCEFE8; --soft-fg:#0A4F42;
  --good:#1E7A3C; --good-bg:#E1F2E6; --warn:#8A5A00; --warn-bg:#FBF0D6; --bad:#9A2F22; --bad-bg:#FBE5E1; --info:#1F4F8A; --info-bg:#E3ECF8;
  --font:"Mukta","Nirmala UI","Noto Sans Devanagari",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201C; --fg:#E7EEEA; --muted:#9BA9A2; --line:#2A3631;
  --accent:#3DB89B; --accent-fg:#04231B; --soft:#1C3A32; --soft-fg:#A9E5D5;
  --good:#7AD39A; --good-bg:#183A25; --warn:#E8C46A; --warn-bg:#3A2F12; --bad:#F09A8C; --bad-bg:#3D1F1A; --info:#9CC0EE; --info-bg:#1B2B42;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201C; --fg:#E7EEEA; --muted:#9BA9A2; --line:#2A3631;
  --accent:#3DB89B; --accent-fg:#04231B; --soft:#1C3A32; --soft-fg:#A9E5D5;
  --good:#7AD39A; --good-bg:#183A25; --warn:#E8C46A; --warn-bg:#3A2F12; --bad:#F09A8C; --bad-bg:#3D1F1A; --info:#9CC0EE; --info-bg:#1B2B42;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{margin:0;font-size:28px;font-weight:800;line-height:1.15;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:15px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lang{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:44px;padding:0 16px;font-weight:700}
.progress{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 120px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.stat b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.search{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;white-space:nowrap}
.chip small{color:var(--muted);font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;min-height:40px;margin-left:auto}
.check input{width:20px;height:20px;accent-color:var(--accent)}
details.msg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
details.msg summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
details.msg textarea{width:100%;min-height:110px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px;font-size:15px;margin-bottom:6px}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{margin:0;font-size:18px;font-weight:700;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:14px;color:var(--muted);align-items:center}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--soft-fg);white-space:nowrap}
.star{color:var(--warn);font-weight:700}
.phone{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;user-select:all}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;text-decoration:none;border:1px solid transparent}
.btn svg{flex:none}
.call{background:var(--accent);color:var(--accent-fg)}
.wa{background:var(--soft);color:var(--soft-fg)}
.btn.dis{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:600;font-size:14px;cursor:default}
.foot{display:flex;gap:8px;align-items:center}
.foot select{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:15px;min-width:0}
.copy{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;flex:none}
.st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-called{background:var(--info-bg);color:var(--info)} .st-interested{background:var(--warn-bg);color:var(--warn)}
.st-joined{background:var(--good-bg);color:var(--good)} .st-no,.st-dead{background:var(--bad-bg);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.note{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 0}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:filter .15s}.btn:active,.chip:active{filter:brightness(.92)}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <button class="lang" id="lang" type="button"></button>
  </header>

  <div class="progress">
    <div class="stat"><b id="sTotal">0</b><span data-t="sTotal"></span></div>
    <div class="stat"><b id="sCalled">0</b><span data-t="sCalled"></span></div>
    <div class="stat"><b id="sJoined">0</b><span data-t="sJoined"></span></div>
  </div>

  <details class="msg">
    <summary data-t="msgTitle"></summary>
    <p class="hint" data-t="msgHint"></p>
    <label for="msgBox" class="hint" style="display:block;margin:0 0 6px;font-weight:600" data-t="msgLabel"></label>
    <textarea id="msgBox"></textarea>
    <p class="hint"><button type="button" class="copy" id="msgReset" data-t="msgReset"></button></p>
  </details>

  <div class="bar">
    <label for="q" class="hint" style="position:absolute;left:-9999px" data-t="search"></label>
    <input id="q" class="search" type="search" autocomplete="off">
    <div class="chips" id="cities" role="group"></div>
    <div class="row2">
      <div class="chips" id="types" role="group"></div>
      <label class="check"><input type="checkbox" id="onlyPhone" checked><span data-t="onlyPhone"></span></label>
    </div>
  </div>

  <div class="list" id="list"></div>
  <p class="note" data-t="note"></p>
</div>

    empty:'Koi result nahi mila. Search ya filter badlo.',
    note:'Status isi phone me save rehta hai. Call button na chale to number copy karke dial karo. Data: Google Maps, 23 Oct 2026.',
    defMsg:'Namaste {name} ji, main [Aapka Naam], property dealer hoon. Aapke area me buyer ya property ho to milkar kaam kar sakte hain, commission share karenge. Kya hum connect kar sakte hain?'
  }
};
function load(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var S = { lang: load('pn_lang','hi'), city:'all', type:'all', q:'', onlyPhone:true, status: load('pn_status',{}), msg: load('pn_msg',{}) };
function t(k){return T[S.lang][k]}
function cityName(c){return S.lang==='hi'?(CITY_HI[c]||c):c}
function digits(p){return (p||'').replace(/\D/g,'')}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function shortName(n){return n.split('|')[0].split(' - ')[0].trim()}
function msgText(){return S.msg[S.lang]||t('defMsg')}

var ICON_CALL='<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>';
var ICON_WA='<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-4A8 8 0 1 1 8.5 19z"/><path d="M9.5 9.5c.3 1.8 2.2 3.8 4 4.2l1-1 1.5.8"/></svg>';

function applyStatic(){
  document.documentElement.lang = S.lang==='hi'?'hi':'en';
  document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t(el.getAttribute('data-t'))});
  document.getElementById('lang').textContent=t('lang');
  document.getElementById('q').placeholder=t('search');
  document.getElementById('msgBox').value=msgText();
}
function renderChips(){
  var base=DATA.filter(function(d){return !S.onlyPhone||d.p});
  var cities=[['all',t('all'),base.length]].concat(CITIES.map(function(c){return [c,cityName(c),base.filter(function(d){return d.c===c}).length]}));
  document.getElementById('cities').innerHTML=cities.map(function(c){return '<button type="button" class="chip" data-city="'+c[0]+'" aria-pressed="'+(S.city===c[0])+'">'+esc(c[1])+'<small>'+c[2]+'</small></button>'}).join('');
  var types=[['all',t('all')],['Dealer',t('dealer')],['Builder',t('builder')]];
  document.getElementById('types').innerHTML=types.map(function(x){return '<button type="button" class="chip" data-type="'+x[0]+'" aria-pressed="'+(S.type===x[0])+'">'+esc(x[1])+'</button>'}).join('');
}
function renderStats(){
  var withPhone=DATA.filter(function(d){return d.p});
  var called=withPhone.filter(function(d){var s=S.status[d.id];return s&&s!=='dead'}).length;
  var joined=withPhone.filter(function(d){return S.status[d.id]==='joined'}).length;
  document.getElementById('sTotal').textContent=withPhone.length;
  document.getElementById('sCalled').textContent=called;
  document.getElementById('sJoined').textContent=joined;
}
function card(d){
  var dg=digits(d.p), st=S.status[d.id]||'';
  var place=cityName(d.c)+(d.t?' ('+cityName(d.t)+')':'');
  var h='<article class="card"><div class="top"><h2 class="name">'+esc(d.n)+'</h2><span class="pill">'+(d.ty==='Dealer'?t('dealer'):t('builder'))+'</span></div>';
  h+='<div class="meta"><span>'+esc(place)+'</span>'+(d.r?'<span class="star">★ '+d.r+'</span><span>'+(d.v||0)+' '+t('reviews')+'</span>':'')+(st?'<span class="st st-'+st+'">'+esc(t('st')[st])+'</span>':'')+'</div>';
  if(d.a) h+='<div class="meta">'+esc(d.a)+'</div>';
  if(dg){
    h+='<div class="phone">'+esc(d.p)+'</div><div class="actions">';
    h+='<a class="btn call" href="tel:+'+dg+'" target="_top" data-mark="'+d.id+'">'+ICON_CALL+t('call')+'</a>';
    if(d.w){
      var txt=msgText().replace(/\{name\}/g,shortName(d.n));
      h+='<a class="btn wa" href="https://wa.me/'+dg+'?text='+encodeURIComponent(txt)+'" target="_blank" rel="noopener" data-mark="'+d.id+'">'+ICON_WA+t('wa')+'</a>';
    } else h+='<span class="btn dis">'+t('landline')+'</span>';
    h+='</div><div class="foot"><label for="s'+d.id+'" style="position:absolute;left:-9999px">'+t('status')+'</label><select id="s'+d.id+'" data-status="'+d.id+'"><option value="">'+t('status')+'</option>'+STATUSES.map(function(s){return '<option value="'+s+'"'+(s===st?' selected':'')+'>'+esc(t('st')[s])+'</option>'}).join('')+'</select><button type="button" class="copy" data-copy="'+d.id+'">'+t('copy')+'</button></div>';
  } else h+='<div class="meta">'+t('nophone')+'</div>';
  return h+'</article>';
}
function renderList(){
  var q=S.q.trim().toLowerCase();
  var rows=DATA.filter(function(d){
    if(S.onlyPhone&&!d.p) return false;
    if(S.city!=='all'&&d.c!==S.city) return false;
    if(S.type!=='all'&&d.ty!==S.type) return false;
    if(q&&(d.n+' '+d.a+' '+d.c+' '+(CITY_HI[d.c]||'')).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  document.getElementById('list').innerHTML=rows.length?rows.map(card).join(''):'<p class="empty">'+t('empty')+'</p>';
}
function all(){applyStatic();renderChips();renderStats();renderList()}

document.getElementById('lang').addEventListener('click',function(){S.lang=S.lang==='hi'?'en':'hi';save('pn_lang',S.lang);all()});
document.getElementById('q').addEventListener('input',function(e){S.q=e.target.value;renderList()});
document.getElementById('onlyPhone').addEventListener('change',function(e){S.onlyPhone=e.target.checked;renderChips();renderList()});
document.getElementById('cities').addEventListener('click',function(e){var b=e.target.closest('[data-city]');if(!b)return;S.city=b.getAttribute('data-city');renderChips();renderList()});
document.getElementById('types').addEventListener('click',function(e){var b=e.target.closest('[data-type]');if(!b)return;S.type=b.getAttribute('data-type');renderChips();renderList()});
document.getElementById('msgBox').addEventListener('input',function(e){S.msg[S.lang]=e.target.value;save('pn_msg',S.msg)});
document.getElementById('msgBox').addEventListener('change',renderList);
document.getElementById('msgReset').addEventListener('click',function(){delete S.msg[S.lang];save('pn_msg',S.msg);document.getElementById('msgBox').value=msgText();renderList()});
var list=document.getElementById('list');
list.addEventListener('change',function(e){var id=e.target.getAttribute('data-status');if(id===null)return;if(e.target.value)S.status[id]=e.target.value;else delete S.status[id];save('pn_status',S.status);renderStats();renderList()});
list.addEventListener('click',function(e){
  var c=e.target.closest('[data-copy]');
  if(c){
    var d=DATA[+c.getAttribute('data-copy')], num='+'+digits(d.p);
    var done=function(){c.textContent=t('copied');setTimeout(function(){c.textContent=t('copy')},1500)};
    try{navigator.clipboard.writeText(num).then(done,function(){selectPhone(c)})}catch(err){selectPhone(c)}
  }
});
function selectPhone(btn){var p=btn.closest('.card').querySelector('.phone');var r=document.createRange();r.selectNodeContents(p);var s=getSelection();s.removeAllRanges();s.addRange(r)}
all();
</script>

</body>
</html>
